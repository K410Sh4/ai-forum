name: Cloudflare production release gate (manual deployment)
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'scripts/verify-deployment.mjs'
      - '.github/workflows/cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and integration tests
        run: npm run check && npm test
      - name: Confirm remote deployment is intentionally disabled
        run: |
          echo '### Production deployment requires operator approval and a durable private D1 backup' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow never invokes Wrangler against production. Use Ativar-UniversalAccess.ps1 from a clean main checkout after staging review and back up the remote D1 to a private local location.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PASS: no automatic D1 migrations or Worker deployment were attempted.'
